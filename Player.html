<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ANIFLIX PLAYER</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#000;
color:white;
padding:15px;
}

.topbar{
display:flex;
align-items:center;
gap:20px;
padding:10px 0;
margin-bottom:15px;
}

.logo{
font-size:38px;
font-weight:bold;
color:red;
}

.menu{
font-size:34px;
}

.player-container{
position:relative;
width:105%;
max-width:100000px;
margin:auto;;
overflow:hidden;
background:#111;
}

video{
position:relative;
width:105%;
height:000;
margin:auto;
overflow:hidden;
display:block;
}

/* DARK OVERLAY */
.overlay{
position:absolute;
inset:0;
background:linear-gradient(
to top,
rgba(99,99,99,0.5)
rgba(0,0,0,0.5)
rgba(0,0,0,0.7)
);
pointer-events:none;
}

/* CENTER CONTROLS */
.center-controls{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
display:flex;
align-items:center;
gap:60px;
z-index:5;
}

.control-btn{
width:80px;
height:80px;
border-radius:50%;
border:none;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(12px);
color:white;
font-size:35px;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
transition:0.3s;
}

.control-btn:hover{
transform:scale(1.1);
background:rgba(255,255,255,0.15);
}

/* BOTTOM CONTROLS */
.bottom-controls{
position:absolute;
bottom:0;
left:0;
width:100%;
padding:5px;
z-index:10;
background:linear-gradient(
to top,
rgba(0,0,0,0.95),
transparent
);
}

/* SEEKBAR */
.seekbar{
width:100%;
height:6px;
background:rgba(255,255,255,0.3);
border-radius:50px;
overflow:hidden;
cursor:pointer;
margin-bottom:15px;
}

.progress{
width:0%;
height:100%;
background:red;
border-radius:50px;
}

/* CONTROL ROW */
.controls-row{
display:flex;
justify-content:space-between;
align-items:center;
}

.left-controls,
.right-controls{
display:flex;
align-items:center;
gap:12px;
}

.small-btn{
width:55px;
height:55px;
border:none;
border-radius:50%;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(12px);
color:white;
font-size:22px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.time{
padding:12px 18px;
border-radius:50px;
background:rgba(0,0,0,0.45);
backdrop-filter:blur(12px);
font-size:24px;
}

/* INFO CARD */
.info-card{
margin-top:25px;
background:#0d0d0d;
padding:25px;
border-radius:25px;
}

.ep-title{
font-size:40px;
font-weight:bold;
margin-bottom:10px;
}

.desc{
color:#999;
font-size:22px;
}

/* MOBILE */
@media(max-width:768px){

.logo{
font-size:26px;
}

.control-btn{
width:65px;
height:65px;
font-size:20px;
}

.center-controls{
gap:30px;
}

.small-btn{
width:45px;
height:45px;
font-size:18px;
}

.time{
font-size:16px;
padding:10px 14px;
}

.ep-title{
font-size:28px;
}

.desc{
font-size:16px;
}

}
/* PLAYER HEIGHT BARAO */

.player-container{
height:25vh;
max-height:900px;
}

video{
height:92%;
object-fit:cover;
}
/* SMOOTH HIDE EFFECT */

.center-controls,
.bottom-controls{
transition:0.3s;
}
</style>
</head>

<body>

<div class="topbar">
<i class="fa-solid fa-bars menu"></i>
<div class="logo">ANIFLIX</div>
</div>

<div class="player-container">

<video id="video">
<source src="hero-vinand.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- CENTER BUTTONS -->
<div class="center-controls">

<button class="control-btn" id="backward">
<i class="fa-solid fa-backward"></i>
</button>

<button class="control-btn" id="playPause">
<i class="fa-solid fa-pause"></i>
</button>

<button class="control-btn" id="forward">
<i class="fa-solid fa-forward"></i>
</button>

</div>

<!-- BOTTOM CONTROLS -->
<div class="bottom-controls">

<div class="seekbar" id="seekbar">
<div class="progress" id="progress"></div>
</div>

<div class="controls-row">

<div class="left-controls">

<button class="small-btn" id="playBottom">
<i class="fa-solid fa-pause"></i>
</button>

<button class="small-btn" id="muteBtn">
<i class="fa-solid fa-volume-high"></i>
</button>

<div class="time">
<span id="current">0:00</span>
/
<span id="duration">0:00</span>
</div>

</div>

<div class="right-controls">

<button class="small-btn">
<i class="fa-solid fa-gear"></i>
</button>

<button class="small-btn" id="fullscreen">
<i class="fa-solid fa-expand"></i>
</button>

</div>

</div>

</div>

</div>

<!-- INFO -->
<div class="info-card">

<div class="ep-title">
Ep 1: Episode 1
</div>

<div class="desc">
Episode description goes here...
</div>

</div>

<script>

const video = document.getElementById("video");

const playPause = document.getElementById("playPause");
const playBottom = document.getElementById("playBottom");

const backward = document.getElementById("backward");
const forward = document.getElementById("forward");

const muteBtn = document.getElementById("muteBtn");
const fullscreen = document.getElementById("fullscreen");

const progress = document.getElementById("progress");
const seekbar = document.getElementById("seekbar");

const current = document.getElementById("current");
const duration = document.getElementById("duration");

/* PLAY / PAUSE */

function togglePlay(){

if(video.paused){

video.play();

playPause.innerHTML =
'<i class="fa-solid fa-pause"></i>';

playBottom.innerHTML =
'<i class="fa-solid fa-pause"></i>';

}else{

video.pause();

playPause.innerHTML =
'<i class="fa-solid fa-play"></i>';

playBottom.innerHTML =
'<i class="fa-solid fa-play"></i>';

}

}

playPause.onclick = togglePlay;
playBottom.onclick = togglePlay;

/* SKIP */

forward.onclick = () =>{
video.currentTime += 10;
}

backward.onclick = () =>{
video.currentTime -= 10;
}

/* MUTE */

muteBtn.onclick = () =>{

video.muted = !video.muted;

if(video.muted){

muteBtn.innerHTML =
'<i class="fa-solid fa-volume-xmark"></i>';

}else{

muteBtn.innerHTML =
'<i class="fa-solid fa-volume-high"></i>';

}

}

/* FULLSCREEN */

fullscreen.onclick = () =>{

if(!document.fullscreenElement){

document.querySelector(".player-container")
.requestFullscreen();

}else{

document.exitFullscreen();

}

}

/* SEEKBAR */

video.addEventListener("timeupdate", ()=>{

const percent =
(video.currentTime / video.duration) * 100;

progress.style.width = percent + "%";

current.innerText = formatTime(video.currentTime);

duration.innerText = formatTime(video.duration);

});

seekbar.addEventListener("click", (e)=>{

const width = seekbar.clientWidth;

const clickX = e.offsetX;

video.currentTime =
(clickX / width) * video.duration;

});

/* TIME FORMAT */

function formatTime(time){

const minutes = Math.floor(time / 60);

const seconds = Math.floor(time % 60);

return `${minutes}:${seconds < 10 ? "0" : ""}${seconds}`;

}

video.play();

/* AUTO HIDE CONTROLS */

const centerControls =
document.querySelector(".center-controls");

const bottomControls =
document.querySelector(".bottom-controls");

const overlay =
document.querySelector(".overlay");

let hideTimeout;

/* SHOW CONTROLS */

function showControls(){

centerControls.style.opacity = "1";
bottomControls.style.opacity = "1";

clearTimeout(hideTimeout);

hideTimeout = setTimeout(()=>{

if(!video.paused){

centerControls.style.opacity = "0";
bottomControls.style.opacity = "0";

}

},2000);

}

/* CLICK VIDEO AREA */

document.querySelector(".player-container")
.addEventListener("click",(e)=>{

if(
e.target.tagName !== "BUTTON" &&
!e.target.closest("button")
){

if(video.paused){

video.play();

}else{

video.pause();

}

toggleIcons();

showControls();

}

});

/* ICON CHANGE */

function toggleIcons(){

if(video.paused){

playPause.innerHTML =
'<i class="fa-solid fa-play"></i>';

playBottom.innerHTML =
'<i class="fa-solid fa-play"></i>';

}else{

playPause.innerHTML =
'<i class="fa-solid fa-pause"></i>';

playBottom.innerHTML =
'<i class="fa-solid fa-pause"></i>';

}

}

/* MOUSE / TOUCH SHOW */

document.querySelector(".player-container")
.addEventListener("mousemove",showControls);

document.querySelector(".player-container")
.addEventListener("touchstart",showControls);

/* START */

showControls();

</script>

</body>
</html>
